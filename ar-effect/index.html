<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minsey's AR Repository</title>
    <style>
      /*
       * Tiny pre-React screen.
       *
       * IMPORTANT:
       * Use the same font family as your portfolio here.
       * Replace "YOUR_PORTFOLIO_FONT" with the font used
       * in your index.css / Tailwind setup.
       */

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;

        color: #f7f2ee;

        font-family: "YOUR_PORTFOLIO_FONT", sans-serif;

        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #initial-loader-text {
        margin: 0;

        font-size: clamp(32px, 7vw, 60px);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.05em;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <h1 id="initial-loader-text">
        Welcome to Minsey's AR Repository!
      </h1>
    </div>
    <script>
      if (
        window.location.pathname !== "/" &&
        window.location.pathname !== "/index.html"
      ) {
        document.getElementById("initial-loader")?.remove();
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
